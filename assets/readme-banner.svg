<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <style>
    @keyframes walk {
      0%   { transform: translateX(-60px); }
      100% { transform: translateX(840px); }
    }
    @keyframes legSwap {
      0%,49%  { opacity: 1; }
      50%,100% { opacity: 0; }
    }
    @keyframes legSwapB {
      0%,49%  { opacity: 0; }
      50%,100% { opacity: 1; }
    }
    @keyframes starBlink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.1; }
    }
    @keyframes cloudMove {
      0%   { transform: translateX(-120px); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateX(860px); opacity: 0; }
    }
    @keyframes cloudMove2 {
      0%   { transform: translateX(-120px); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateX(860px); opacity: 0; }
    }
    @keyframes flameFlic {
      0%,100% { transform: scaleY(1)   scaleX(1); }
      33%     { transform: scaleY(1.2) scaleX(0.9); }
      66%     { transform: scaleY(0.9) scaleX(1.1); }
    }
    .knight  { animation: walk 7s linear infinite; }
    .legA    { animation: legSwap  0.32s steps(1) infinite; }
    .legB    { animation: legSwapB 0.32s steps(1) infinite; }
    .s1 { animation: starBlink 1.1s ease-in-out infinite; }
    .s2 { animation: starBlink 1.7s ease-in-out infinite 0.4s; }
    .s3 { animation: starBlink 1.4s ease-in-out infinite 0.8s; }
    .s4 { animation: starBlink 2.0s ease-in-out infinite 0.2s; }
    .s5 { animation: starBlink 1.3s ease-in-out infinite 1.1s; }
    .cloud1 { animation: cloudMove  11s linear infinite; }
    .cloud2 { animation: cloudMove2 15s linear infinite 5s; }
    .flame  { animation: flameFlic 0.18s ease-in-out infinite; transform-origin: center bottom; }
  </style>

  <!-- Sky -->
  <rect width="800" height="82" fill="#17151C"/>

  <!-- Stars -->
  <rect class="s1" x="40"  y="8"  width="3" height="3" fill="#C49A45"/>
  <rect class="s2" x="110" y="20" width="2" height="2" fill="#A99F89"/>
  <rect class="s3" x="190" y="10" width="3" height="3" fill="#E0BC63"/>
  <rect class="s4" x="290" y="18" width="2" height="2" fill="#C49A45"/>
  <rect class="s5" x="380" y="7"  width="3" height="3" fill="#A99F89"/>
  <rect class="s1" x="470" y="22" width="2" height="2" fill="#E0BC63"/>
  <rect class="s2" x="560" y="12" width="3" height="3" fill="#C49A45"/>
  <rect class="s3" x="650" y="19" width="2" height="2" fill="#A99F89"/>
  <rect class="s4" x="720" y="9"  width="3" height="3" fill="#E0BC63"/>
  <rect class="s5" x="770" y="24" width="2" height="2" fill="#C49A45"/>
  <rect class="s1" x="80"  y="30" width="2" height="2" fill="#A99F89"/>
  <rect class="s3" x="340" y="28" width="2" height="2" fill="#C49A45"/>
  <rect class="s5" x="610" y="30" width="2" height="2" fill="#E0BC63"/>

  <!-- Cloud 1 -->
  <g class="cloud1">
    <rect x="0"  y="28" width="12"  height="10" fill="#2A2020"/>
    <rect x="12" y="22" width="28" height="16" fill="#2A2020"/>
    <rect x="40" y="24" width="22" height="14" fill="#2A2020"/>
    <rect x="62" y="28" width="14" height="10" fill="#2A2020"/>
    <!-- highlight -->
    <rect x="14" y="23" width="24" height="3" fill="#3A2D29"/>
  </g>

  <!-- Cloud 2 -->
  <g class="cloud2">
    <rect x="0"  y="32" width="10" height="8"  fill="#2A2020"/>
    <rect x="10" y="26" width="22" height="14" fill="#2A2020"/>
    <rect x="32" y="28" width="18" height="12" fill="#2A2020"/>
    <rect x="50" y="32" width="10" height="8"  fill="#2A2020"/>
    <rect x="12" y="27" width="18" height="3"  fill="#3A2D29"/>
  </g>

  <!-- Mountain silhouette back -->
  <polygon points="0,82 80,40 160,68 240,28 320,58 400,18 480,52 560,30 640,55 720,35 800,50 800,82" fill="#2A2020"/>
  <!-- Mountain silhouette front -->
  <polygon points="0,82 60,55 130,70 220,42 310,65 400,38 500,60 590,44 680,62 760,48 800,56 800,82" fill="#344B35"/>

  <!-- Ground grass -->
  <rect y="82" width="800" height="6"  fill="#557A45"/>
  <!-- Grass detail -->
  <rect y="80" x="50"  width="6" height="3" fill="#557A45"/>
  <rect y="80" x="150" width="6" height="3" fill="#557A45"/>
  <rect y="80" x="260" width="6" height="3" fill="#557A45"/>
  <rect y="80" x="380" width="6" height="3" fill="#557A45"/>
  <rect y="80" x="500" width="6" height="3" fill="#557A45"/>
  <rect y="80" x="620" width="6" height="3" fill="#557A45"/>
  <rect y="80" x="740" width="6" height="3" fill="#557A45"/>
  <!-- Dirt -->
  <rect y="88" width="800" height="32" fill="#5B3E31"/>
  <rect y="94" width="800" height="2"  fill="#4A3024"/>
  <rect y="100" width="800" height="2" fill="#4A3024"/>

  <!-- Torches (static) -->
  <!-- Torch 1 at x=120 -->
  <rect x="122" y="66" width="6"  height="16" fill="#4A3024"/>
  <g class="flame">
    <rect x="120" y="56" width="10" height="12" fill="#FFAA00"/>
    <rect x="122" y="54" width="6"  height="4"  fill="#FF6600"/>
    <rect x="124" y="52" width="2"  height="3"  fill="#FFE066"/>
  </g>
  <rect x="112" y="56" width="26" height="26" fill="rgba(255,140,0,0.07)" rx="13"/>

  <!-- Torch 2 at x=400 -->
  <rect x="402" y="66" width="6"  height="16" fill="#4A3024"/>
  <g class="flame">
    <rect x="400" y="56" width="10" height="12" fill="#FFAA00"/>
    <rect x="402" y="54" width="6"  height="4"  fill="#FF6600"/>
    <rect x="404" y="52" width="2"  height="3"  fill="#FFE066"/>
  </g>
  <rect x="392" y="56" width="26" height="26" fill="rgba(255,140,0,0.07)" rx="13"/>

  <!-- Torch 3 at x=660 -->
  <rect x="662" y="66" width="6"  height="16" fill="#4A3024"/>
  <g class="flame">
    <rect x="660" y="56" width="10" height="12" fill="#FFAA00"/>
    <rect x="662" y="54" width="6"  height="4"  fill="#FF6600"/>
    <rect x="664" y="52" width="2"  height="3"  fill="#FFE066"/>
  </g>
  <rect x="652" y="56" width="26" height="26" fill="rgba(255,140,0,0.07)" rx="13"/>

  <!-- Walking Knight (16x20 pixel art, scaled 3x) -->
  <g class="knight">
    <!-- Red plume -->
    <rect x="9"  y="0"  width="12" height="3" fill="#A94442"/>
    <rect x="9"  y="3"  width="3"  height="3" fill="#A94442"/>
    <!-- Helmet -->
    <rect x="6"  y="3"  width="12" height="3" fill="#9A9298"/>
    <rect x="3"  y="6"  width="18" height="9" fill="#8B898F"/>
    <!-- Visor slit -->
    <rect x="12" y="9"  width="9"  height="3" fill="#17151C"/>
    <rect x="9"  y="9"  width="3"  height="3" fill="#6A686E"/>
    <!-- Body armor -->
    <rect x="6"  y="15" width="12" height="9" fill="#68666B"/>
    <rect x="6"  y="15" width="12" height="3" fill="#7A787D"/>
    <!-- Belt -->
    <rect x="6"  y="21" width="12" height="3" fill="#4A3024"/>
    <!-- Arms -->
    <rect x="3"  y="15" width="3"  height="6" fill="#8B898F"/>
    <rect x="18" y="15" width="3"  height="6" fill="#8B898F"/>
    <!-- Sword -->
    <rect x="21" y="6"  width="3"  height="15" fill="#C0C0D0"/>
    <rect x="18" y="9"  width="9"  height="3"  fill="#C49A45"/>
    <!-- Shield hint -->
    <rect x="0"  y="12" width="6"  height="9"  fill="#496A9B"/>
    <rect x="1"  y="13" width="4"  height="7"  fill="#3A5280"/>
    <rect x="2"  y="15" width="2"  height="3"  fill="#C49A45"/>

    <!-- Legs frame A -->
    <g class="legA">
      <rect x="6"  y="24" width="6"  height="6" fill="#4A484D"/>
      <rect x="12" y="27" width="6"  height="3" fill="#4A484D"/>
      <rect x="6"  y="30" width="6"  height="3" fill="#3A383D"/>
      <rect x="15" y="30" width="3"  height="3" fill="#3A383D"/>
    </g>
    <!-- Legs frame B -->
    <g class="legB">
      <rect x="6"  y="27" width="6"  height="3" fill="#4A484D"/>
      <rect x="12" y="24" width="6"  height="6" fill="#4A484D"/>
      <rect x="6"  y="30" width="3"  height="3" fill="#3A383D"/>
      <rect x="15" y="30" width="6"  height="3" fill="#3A383D"/>
    </g>
  </g>
</svg>
